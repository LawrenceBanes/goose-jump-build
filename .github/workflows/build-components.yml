name: Build Goose Jump components (source only)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      jump_impulse:
        description: Initial vertical impulse (Unity units per second)
        required: true
        default: "2.5"
        type: string

permissions:
  contents: read

jobs:
  build-components:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Reject game assets and oversized files
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path('.')
          forbidden = []
          for path in root.rglob('*'):
              if '.git' in path.parts or 'build' in path.parts:
                  continue
              if path.is_file() and (path.suffix.lower() == '.ipa' or path.stat().st_size > 20 * 1024 * 1024):
                  forbidden.append(str(path))
          if forbidden:
              raise SystemExit('Proprietary or oversized input found: ' + ', '.join(forbidden))
          PY

      - name: Install LLVM
        run: brew install llvm lld

      - name: Compile and validate iPhoneOS ARM64 components
        env:
          JUMP_IMPULSE: ${{ inputs.jump_impulse || '2.5' }}
        run: |
          LLVM_BIN="$(brew --prefix llvm)/bin"
          LD_BIN="$(command -v ld.lld)"
          export PATH="$LLVM_BIN:$PATH"
          test "$(uname -m)" = "arm64"
          python3 -m py_compile tools/*.py
          python3 -m unittest discover -s tools -v
          python3 tools/build_components.py \
            --out build \
            --impulse "$JUMP_IMPULSE" \
            --commit "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --clang "$LLVM_BIN/clang" \
            --ld "$LD_BIN" \
            --objcopy "$LLVM_BIN/llvm-objcopy" \
            --nm "$LLVM_BIN/llvm-nm"
          xcrun --sdk iphoneos otool -hv -l build/GooseJump.dylib
          xcrun --sdk iphoneos vtool -show-build build/GooseJump.dylib
          xcrun --sdk iphoneos otool -L build/GooseJump.dylib
          xcrun --sdk iphoneos nm -gU build/GooseJump.dylib | grep GooseJumpOverlay
          (cd build && shasum -a 256 -c SHA256SUMS.txt)

      - name: Publish redistributable components only
        uses: actions/upload-artifact@v4
        with:
          name: goose-jump-components-${{ github.sha }}
          path: |
            build/GooseJump.dylib
            build/jump_helper.bin
            build/build-info.json
            build/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
